<script>
// 접근성 개선: 키보드 내비게이션, ARIA 속성, 포커스 관리
document.addEventListener('DOMContentLoaded', () => {
  // 포커스 트랩 (모달/패널용)
  const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      const focusables = Array.from(document.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(el => !el.disabled && el.offsetParent !== null);
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    if (e.key === 'Escape') {
      document.querySelectorAll('.panel[style*="display:"]').forEach(p => p.style.display = 'none');
    }
  });
  
  // ARIA 라이브 리전 추가
  const liveRegion = document.createElement('div');
  liveRegion.setAttribute('aria-live', 'polite');
  liveRegion.setAttribute('aria-atomic', 'true');
  liveRegion.style.position = 'absolute';
  liveRegion.style.left = '-9999px';
  liveRegion.id = 'ariaLiveRegion';
  document.body.appendChild(liveRegion);
  
  window.announce = (message) => {
    const region = document.getElementById('ariaLiveRegion');
    if (region) {
      region.textContent = '';
      setTimeout(() => region.textContent = message, 100);
    }
  };
});

// 20. 차트.js 연동 대시보드
const dashboardCharts = {};
function initDashboardCharts() {
  if (typeof Chart === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
    script.onload = createDashboardCharts;
    document.head.appendChild(script);
  } else {
    createDashboardCharts();
  }
}

function createDashboardCharts() {
  const ctx1 = document.getElementById('chartDecisionTime');
  if (ctx1) {
    dashboardCharts.decisionTime = new Chart(ctx1, {
      type: 'line',
      data: { labels: [], datasets: [{ label: '결정 시간(ms)', data: [], borderColor: 'var(--sky)', tension: 0.3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
  }
  
  const ctx2 = document.getElementById('chartConfidence');
  if (ctx2) {
    dashboardCharts.confidence = new Chart(ctx2, {
      type: 'doughnut',
      data: { labels: ['높음 (≥70%)', '보통 (50-70%)', '낮음 (<50%)'], datasets: [{ data: [0,0,0], backgroundColor: ['var(--good)','var(--warn)','var(--bad)'] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
  
  const ctx3 = document.getElementById('chartThroughput');
  if (ctx3) {
    dashboardCharts.throughput = new Chart(ctx3, {
      type: 'bar',
      data: { labels: [], datasets: [{ label: '처리 건수', data: [], backgroundColor: 'var(--sky)' }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
  }
}

function updateDashboardCharts(run) {
  if (!dashboardCharts.decisionTime) return;
  
  const dtChart = dashboardCharts.decisionTime;
  dtChart.data.labels.push(new Date().toLocaleTimeString('ko-KR'));
  dtChart.data.datasets[0].data.push(run.ms);
  if (dtChart.data.labels.length > 20) { dtChart.data.labels.shift(); dtChart.data.datasets[0].data.shift(); }
  dtChart.update('none');
  
  const cfChart = dashboardCharts.confidence;
  const idx = run.confidence >= 0.7 ? 0 : run.confidence >= 0.5 ? 1 : 2;
  cfChart.data.datasets[0].data[idx]++;
  cfChart.update('none');
  
  const tpChart = dashboardCharts.throughput;
  const hour = new Date().getHours();
  const idxH = tpChart.data.labels.indexOf(hour + '시');
  if (idxH >= 0) {
    tpChart.data.datasets[0].data[idxH]++;
  } else {
    tpChart.data.labels.push(hour + '시');
    tpChart.data.datasets[0].data.push(1);
  }
  tpChart.update('none');
}

function addDashboardPanel() {
  if (document.getElementById('dashboardPanel')) return;
  const panel = document.createElement('div');
  panel.id = 'dashboardPanel';
  panel.className = 'panel';
  panel.style.cssText = 'position:fixed;bottom:10px;right:900px;width:400px;height:400px;display:none;z-index:100;';
  panel.innerHTML = `
    <div class="hd" style="margin:-10px -10px 10px;padding:10px;background:var(--ink);color:#fff;border-radius:4px 4px 0 0;display:flex;justify-content:space-between;">
      <div style="font-size:13px;">📊 실시간 대시보드</div>
      <button class="btn ghost tiny" onclick="document.getElementById('dashboardPanel').style.display='none'">닫기</button>
    </div>
    <div class="bd" style="padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;height:calc(100%-40px);">
      <div style="height:100%;"><canvas id="chartDecisionTime"></canvas></div>
      <div style="height:100%;"><canvas id="chartConfidence"></canvas></div>
      <div style="height:100%;grid-column:span 2;"><canvas id="chartThroughput"></canvas></div>
    </div>
  `;
  document.body.appendChild(panel);
  initDashboardCharts();
}

function addDashboardToggle() {
  if (document.getElementById('toggleDashboard')) return;
  const btn = document.createElement('button');
  btn.id = 'toggleDashboard';
  btn.className = 'btn';
  btn.style.cssText = 'position:fixed;top:50px;right:10px;z-index:1000;';
  btn.title = '대시보드 열기/닫기';
  btn.textContent = '📊';
  btn.onclick = () => {
    const panel = document.getElementById('dashboardPanel');
    if (panel) {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      if (panel.style.display === 'block') initDashboardCharts();
    }
  };
  document.body.appendChild(btn);
}

document.addEventListener('DOMContentLoaded', () => {
  addDashboardToggle();
  addDashboardPanel();
});

// 16. 실제 WebSocket 서버 인증 연결
let authWs = null;
function connectAuthWs() {
  const url = document.getElementById('wsServerUrl').value;
  const token = document.getElementById('wsAuthToken').value;
  if (!url) return alert('URL을 입력하세요');
  
  if (authWs) authWs.close();
  authWs = new WebSocket(url);
  
  authWs.onopen = () => {
    console.log('인증 WebSocket 연결됨');
    if (document.getElementById('wsAuthToken').value) {
      authWs.send(JSON.stringify({ type: 'auth', token: document.getElementById('wsAuthToken').value }));
    }
    updateWsAuthStatus('connected');
  };
  
  authWs.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'auth_result') {
        if (data.success) {
          state.settings.connected = true;
          updateHud();
          announce('WebSocket 인증 성공');
        } else {
          announce('인증 실패: ' + data.message);
        }
      }
    } catch (e) {}
  };
  
  authWs.onclose = () => {
    updateWsAuthStatus('disconnected');
  };
  
  authWs.onerror = (err) => {
    console.error('인증 WebSocket 오류:', err);
    updateWsAuthStatus('error');
  };
}

function disconnectAuthWs() {
  if (authWs) {
    authWs.close();
    authWs = null;
    updateWsAuthStatus('disconnected');
  }
}

function updateWsAuthStatus(status) {
  const badge = document.getElementById('wsStatusBadge');
  if (badge) {
    badge.className = 'badge ' + (status === 'connected' ? 'ai' : 'demo');
    badge.textContent = status === 'connected' ? 'WS 인증됨' : 'WS 끊김';
  }
}

// 18. 실시간 협업 (WebRTC 시그널링 + 커서 공유)
let collabWs = null;
let collabPeers = new Map();
let myCollabId = null;

function joinCollabRoom() {
  const name = document.getElementById('collabUserName').value;
  const roomId = document.getElementById('collabRoomId').value;
  if (!name || !roomId) return alert('이름과 방 ID를 입력하세요');
  
  const wsUrl = state.settings.wsUrl || 'wss://echo.websocket.org';
  collabWs = new WebSocket(wsUrl);
  
  collabWs.onopen = () => {
    collabWs.send(JSON.stringify({ type: 'join', room: document.getElementById('collabRoomId').value, name }));
  };
  
  collabWs.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      switch (data.type) {
        case 'joined':
          myCollabId = data.id;
          updateCollabUsers(data.users);
          break;
        case 'user_joined':
          updateCollabUsers(data.users);
          announce(data.name + '님이 입장했습니다');
          break;
        case 'user_left':
          updateCollabUsers(data.users);
          announce(data.name + '님이 퇴장했습니다');
          break;
        case 'cursor':
          updateRemoteCursor(data.userId, data.x, data.y, data.name, data.color);
          break;
      }
    } catch (e) {}
  };
  
  collabWs.onclose = () => {
    collabPeers.clear();
    updateCollabUsers([]);
  };
}

function leaveCollabRoom() {
  if (collabWs) {
    collabWs.close();
    collabWs = null;
  }
  collabPeers.clear();
  updateCollabUsers([]);
}

function updateCollabUsers(users) {
  const container = document.getElementById('collabUsers');
  if (!container) return;
  container.innerHTML = users.map(u => `<div style="color:${u.color};">${u.name}${u.id === myCollabId ? ' (나)' : ''}</div>`).join('');
}

document.addEventListener('mousemove', (e) => {
  if (collabWs && collabWs.readyState === WebSocket.OPEN) {
    collabWs.send(JSON.stringify({ type: 'cursor', x: e.clientX, y: e.clientY }));
  }
});

function updateRemoteCursor(userId, x, y, name, color) {
  let cursor = document.getElementById('cursor-' + userId);
  if (!cursor) {
    cursor = document.createElement('div');
    cursor.id = 'cursor-' + userId;
    cursor.style.cssText = 'position:absolute;pointer-events:none;z-index:9999;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);transition:left 0.05s,top 0.05s;';
    cursor.innerHTML = `<div style="width:100%;height:100%;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 0 4px rgba(0,0,0,0.3);"></div><div style="position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:rgba(0,0,0,0.7);color:white;padding:1px 4px;border-radius:3px;">${name}</div>`;
    document.body.appendChild(cursor);
  }
  cursor.style.left = x + 'px';
  cursor.style.top = y + 'px';
}
