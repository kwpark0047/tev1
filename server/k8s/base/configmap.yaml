apiVersion: v1
kind: ConfigMap
metadata:
  name: tev1-ws-config
  namespace: tev1
data:
  PORT: "8081"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  WS_HEARTBEAT_INTERVAL: "30000"
  WS_MAX_RECONNECT_ATTEMPTS: "5"
  CORS_ORIGINS: "https://tev1.example.com,https://tev1-admin.example.com"
  LOG_LEVEL: "info"