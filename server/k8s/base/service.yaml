apiVersion: v1
kind: Service
metadata:
  name: tev1-ws
  namespace: tev1
  labels:
    app: tev1-ws
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: tev1-ws
  ports:
  - name: ws
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 8082
    targetPort: 8082
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: tev1-ws-headless
  namespace: tev1
  labels:
    app: tev1-ws
spec:
  clusterIP: None
  selector:
    app: tev1-ws
  ports:
  - name: ws
    port: 8081
    targetPort: 8081
  - name: metrics
    port: 8082
    targetPort: 8082