apiVersion: v1
kind: ServiceAccount
metadata:
  name: tev1-ws-sa
  namespace: tev1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tev1-ws-role
  namespace: tev1
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tev1-ws-rolebinding
  namespace: tev1
subjects:
- kind: ServiceAccount
  name: tev1-ws-sa
  namespace: tev1
roleRef:
  kind: Role
  name: tev1-ws-role
  apiGroup: rbac.authorization.k8s.io