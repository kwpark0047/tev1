apiVersion: v1
kind: Secret
metadata:
  name: tev1-secrets
  namespace: tev1
type: Opaque
stringData:
  # Base64로 인코딩된 값들이 실제 배포 시 채워져야 함
  DATABASE_URL: "postgresql://tev1:CHANGE_ME@tev1-postgres:5432/tev1"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  GOOGLE_REDIRECT_URI: "https://tev1.example.com/api/auth/google/callback"
  VAPID_PUBLIC_KEY: "CHANGE_ME"
  VAPID_PRIVATE_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"