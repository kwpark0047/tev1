apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tev1-ingress
  namespace: tev1
  annotations:
    # NGINX Ingress Controller 설정
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-buffers-size: "8k"
    # WebSocket 지원
    nginx.ingress.kubernetes.io/websocket-services: "tev1-app"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
    # Cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tev1.example.com
      secretName: tev1-tls
  rules:
    - host: tev1.example.com
      http:
        paths:
          # WebSocket (Socket.IO)
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: tev1-app
                port:
                  number: 8081
          # API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tev1-app
                port:
                  number: 8081
          # Health checks
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: tev1-app
                port:
                  number: 8081
          # Main app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tev1-app
                port:
                  number: 8081