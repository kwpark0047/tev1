apiVersion: v1
kind: Service
metadata:
  name: tev1-app
  namespace: tev1
  labels:
    app: tev1
    component: server
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: tev1
    component: server
---
apiVersion: v1
kind: Service
metadata:
  name: tev1-redis
  namespace: tev1
  labels:
    app: tev1
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: tev1
    component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: tev1-postgres
  namespace: tev1
  labels:
    app: tev1
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: tev1
    component: postgres